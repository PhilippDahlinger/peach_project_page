name: step_ggns_sd
wandb_name: sd
is_3d: True
z_pos_feature: False
root: ../datasets/pc_mango/sd_v1.hdf5
predict_collider: False

cache_path: ../datasets/pc_mango/ggns_cache/sd

# Dummy pc_preprocessing for pipeline compatibility
pc_preprocessing:
  output_type: tensor
  temporal_stride: 2
  pcd_subsample_points: 512

train_dataset:
  cache_path: ${dataset.cache_path}
  root: ${dataset.root}
  batch_size: 32
  connectivity_setting: sheet_deformation
  use_mesh_coordinates: True
  use_colors: False
  dataset_size: null
  pcd_subsample_points: 512
  is_3d: ${dataset.is_3d}
  predict_collider: ${dataset.predict_collider}


eval_dataset:
  cache_path: ${dataset.cache_path}
  root: ${dataset.root}
  target_test_trajs: ${algorithm.evaluator.target_test_trajs}
  batch_size: ${len:${algorithm.evaluator.target_test_trajs}}
  connectivity_setting: ${dataset.train_dataset.connectivity_setting}
  use_mesh_coordinates: ${dataset.train_dataset.use_mesh_coordinates}
  use_colors: ${dataset.train_dataset.use_colors}
  dataset_size: null
  pcd_subsample_points: ${dataset.train_dataset.pcd_subsample_points}
  is_3d: ${dataset.is_3d}
  predict_collider: ${dataset.predict_collider}

